spring:
  application:
    name: finflow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finflow}
    username: ${SPRING_DATASOURCE_USERNAME:finflow}
    password: ${SPRING_DATASOURCE_PASSWORD:finflow}

  jpa:
    hibernate:
      ddl-auto: validate   # schema é responsabilidade exclusiva do Flyway
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  jackson:
    serialization:
      write-bigdecimal-as-plain: true   # ADR-0001 §6: BigDecimal como string, nunca number

server:
  port: 8080

finflow:
  cors:
    allowed-origins: ${FINFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${FINFLOW_JWT_SECRET:change-me-in-production-min-256-bits-please-0123456789}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  outbox:
    relay-fixed-delay-ms: 1000
    relay-batch-size: 100
    max-attempts: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
